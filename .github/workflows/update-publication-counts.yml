# Regenerate _data/publication_counts.yml from _bibliography/papers.bib
# When you push (e.g. from GitHub Desktop), this runs and auto-commits + pushes
# the updated counts so you don't have to run the script locally.

name: Update publication counts

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate publication counts
        run: ruby _scripts/generate_publication_counts.rb

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update publication counts from papers.bib'
          file_pattern: _data/publication_counts.yml
